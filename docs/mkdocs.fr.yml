# The pages in fr, see mkdocs.yml
INHERIT: mkdocs.yml

site_description: Recherchez dans le Géoportail suisse et opendata.swiss depuis la barre de localisation de QGIS
site_url: https://opengisch.github.io/qgis-swiss-locator/fr/
edit_uri: edit/main/docs/fr/

docs_dir: fr
site_dir: site/fr

theme:
  language: fr

nav:
  - Accueil: index.md
  - Prise en main: getting-started.md
  - Rechercher des lieux et des objets:
      - search/index.md
      - Lieux: search/locations.md
      - Objets: search/features.md
  - Géocodage: geocoding.md
  - Ajouter des couches:
      - layers/index.md
      - Couches WMS: layers/wms.md
      - Couches WMTS: layers/wmts.md
      - Fonds de plan: layers/base-maps.md
  - Télécharger des données (STAC): downloads.md
  - Profil altimétrique: elevation-profile.md
  - Configuration: configuration.md
  - Sources des données: data-sources.md
