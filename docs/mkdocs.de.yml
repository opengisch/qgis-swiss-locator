# The pages in de, see mkdocs.yml
INHERIT: mkdocs.yml

site_description: Durchsuchen Sie das Geoportal des Bundes und opendata.swiss aus der Locator-Leiste von QGIS
site_url: https://opengisch.github.io/qgis-swiss-locator/de/
edit_uri: edit/main/docs/de/

docs_dir: de
site_dir: site/de

theme:
  language: de

nav:
  - Startseite: index.md
  - Erste Schritte: getting-started.md
  - Orte und Objekte suchen:
      - search/index.md
      - Orte: search/locations.md
      - Objekte: search/features.md
  - Geokodierung: geocoding.md
  - Layer hinzufügen:
      - layers/index.md
      - WMS-Layer: layers/wms.md
      - WMTS-Layer: layers/wmts.md
      - Basiskarten: layers/base-maps.md
  - Daten herunterladen (STAC):
      - downloads/index.md
      - viageo.ch: downloads/viageo.md
      - Basel-Stadt: downloads/basel-stadt.md
  - Höhenprofil: elevation-profile.md
  - Konfiguration: configuration.md
  - Datenquellen: data-sources.md
