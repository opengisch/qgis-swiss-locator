name: Run Tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  QGIS_TEST_VERSION: latest


jobs:
  qgis_deps_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: docker test
        run: |
          docker run -v $(pwd):/usr/src -w /usr/src -e QT_QPA_PLATFORM=offscreen qgis/qgis-slim:${QGIS_TEST_VERSION} \
            sh -c 'python3 -m pytest'
