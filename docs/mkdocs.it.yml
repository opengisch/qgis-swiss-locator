# The pages in it, see mkdocs.yml
INHERIT: mkdocs.yml

site_description: Cercate nel geoportale federale e su opendata.swiss dalla barra di localizzazione di QGIS
site_url: https://opengisch.github.io/qgis-swiss-locator/it/
edit_uri: edit/main/docs/it/

docs_dir: it
site_dir: site/it

theme:
  language: it

nav:
  - Home: index.md
  - Primi passi: getting-started.md
  - Cercare luoghi e oggetti:
      - search/index.md
      - Località: search/locations.md
      - Oggetti: search/features.md
  - Aggiungere layer:
      - layers/index.md
      - Layer WMS: layers/wms.md
      - Layer WMTS: layers/wmts.md
      - Mappe di base: layers/base-maps.md
  - Scaricare dati (STAC): downloads.md
  - Profilo altimetrico: elevation-profile.md
  - Configurazione: configuration.md
  - Fonti dei dati: data-sources.md
