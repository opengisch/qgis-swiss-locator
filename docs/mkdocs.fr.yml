  - Prise en main: getting-started.md
  - Recherche:
      - search/index.md
      - Lieux: search/locations.md
      - Couches: search/layers.md
      - Couches WMTS: search/wmts.md
      - Fonds de plan: search/base-maps.md
      - Objets: search/features.md
      - Téléchargement de fichiers: search/downloads.md
  - Profil altimétrique: elevation-profile.md
  - Configuration: configuration.md
  - Sources des données: data-sources.md
